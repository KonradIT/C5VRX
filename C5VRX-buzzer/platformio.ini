; C5VRX-buzzer -- PlatformIO project configuration.
;
; The official platformio/espressif32 platform supports neither the ESP32-C5
; nor ESP-IDF 6, so the community pioarduino platform is pinned at a fixed
; develop-branch commit. That platform needs the pioarduino core fork of
; PlatformIO (pip install pioarduino) and ships a toolchain older than the one
; ESP-IDF 6.0 insists on; ../tools/pio_idf_toolchain.py installs and uses the
; exact riscv32-esp-elf version from the framework's tools.json. The pinned
; platform commit declares tool-esptoolpy 5.3.1 but links the 5.4.0 manifest
; (its installer then removes the package during every build), hence the
; explicit esptool package. ESP-IDF v6.0.1, 8 MB DIO flash at 40 MHz and a
; 160 MHz CPU follow the conservative ESP32-C5 v1.0 settings of the receiver.
; Run pio from PowerShell or cmd on Windows: the ESP-IDF tool installer refuses
; to run under MSYS/Git Bash.

[platformio]
default_envs = xiao_c5
src_dir = main

[env:xiao_c5]
platform = https://github.com/pioarduino/platform-espressif32.git#59fa8606f96e68f1bc021ba5f4ece28be0d1c42f
platform_packages =
    pioarduino/framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v6.0.1/esp-idf-v6.0.1.tar.xz
    pioarduino/tool-esptoolpy @ https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.3.1.zip
framework = espidf
board = seeed_xiao_esp32c5
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
extra_scripts = pre:../tools/pio_idf_toolchain.py
monitor_speed = 115200
upload_speed = 460800

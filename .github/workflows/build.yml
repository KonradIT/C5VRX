name: C5VRX-3 Production CI

on:
  push:
    branches: [main, "codex/**", "feat/**", "fix/**"]
    paths:
      - "main/**"
      - "!**/*.md"
      - "tools/firmware_input_hash.py"
      - "CMakeLists.txt"
      - "sdkconfig*"
      - "partitions.csv"
      - "dependencies.lock"
      - "managed_components/**"
      - ".github/workflows/build.yml"
  pull_request:
    # Include stacked development PRs so their mutable pr-N firmware channel
    # is created just like a PR targeting main.
    branches: [main, "feat/**", "fix/**", "codex/**"]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "main/**"
      - "!**/*.md"
      - "tools/firmware_input_hash.py"
      - "CMakeLists.txt"
      - "sdkconfig*"
      - "partitions.csv"
      - "dependencies.lock"
      - "managed_components/**"
      - ".github/workflows/build.yml"

# A merged PR emits both pull_request:closed and push:main. GitHub reports
# github.ref=refs/heads/main for the merged/closed PR event too, so grouping
# only by ref lets the cleanup event cancel the real main build/release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve Firmware Version
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_number: ${{ steps.semver.outputs.version_number }}
      previous_tag: ${{ steps.semver.outputs.previous_tag }}
      reason: ${{ steps.semver.outputs.reason }}
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next semantic version
        id: semver
        shell: bash
        run: |
          set -euo pipefail

          # Only pushes to main become public releases. Other builds keep the
          # normal ESP-IDF git-derived development version.
          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "version=" >> "${GITHUB_OUTPUT}"
            echo "version_number=" >> "${GITHUB_OUTPUT}"
            echo "previous_tag=" >> "${GITHUB_OUTPUT}"
            echo "reason=development build" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch --tags --force

          stable_tags() {
            git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          }

          prerelease_tags() {
            git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-' || true
          }

          head_tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          latest_stable="$(stable_tags | head -n1)"
          latest_prerelease="$(prerelease_tags | head -n1)"
          previous_tag=""
          reason=""

          # Makes workflow re-runs idempotent if a tag was already created.
          if [[ -n "${head_tag}" ]]; then
            version="${head_tag}"
            previous_tag="$(stable_tags | grep -vx "${head_tag}" | head -n1 || true)"
            if [[ -z "${previous_tag}" ]]; then
              previous_tag="${latest_prerelease}"
            fi
            reason="reuse existing release tag on HEAD"

          # Promote the existing RC line to its stable version on the first
          # versioned main release (v3.0.0-rc1 -> v3.0.0).
          elif [[ -z "${latest_stable}" && -n "${latest_prerelease}" ]]; then
            version="${latest_prerelease%%-*}"
            previous_tag="${latest_prerelease}"
            reason="promote latest prerelease to stable"

          elif [[ -z "${latest_stable}" ]]; then
            version="v0.1.0"
            reason="initial semantic version"

          else
            previous_tag="${latest_stable}"
            current="${latest_stable#v}"
            IFS='.' read -r major minor patch <<< "${current}"
            commits="$(git log "${latest_stable}..HEAD" --pretty='%s%n%b')"

            if grep -Eq 'BREAKING CHANGE|^[A-Za-z]+(\([^)]+\))?!:' <<< "${commits}"; then
              major=$((major + 1))
              minor=0
              patch=0
              reason="breaking change -> major bump"
            elif grep -Eq '^feat(\([^)]+\))?:' <<< "${commits}"; then
              minor=$((minor + 1))
              patch=0
              reason="feature -> minor bump"
            else
              patch=$((patch + 1))
              reason="fix/chore/docs/other -> patch bump"
            fi

            version="v${major}.${minor}.${patch}"
          fi

          echo "Resolved ${version} (${reason})"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_number=${version#v}" >> "${GITHUB_OUTPUT}"
          echo "previous_tag=${previous_tag}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Architectural & DSP Verification
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Architectural Constraints
        run: |
          python tools/validate_build.py
          bash -n tools/prepare_pages_site.sh

      - name: Dry-run GitHub Pages firmware mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/prepare_pages_site.sh /tmp/c5vrx-pages-test
          jq -e 'length > 0' /tmp/c5vrx-pages-test/firmware/releases.json >/dev/null
          first_asset="$(jq -r '.[0].assets[0].local_url // empty' /tmp/c5vrx-pages-test/firmware/releases.json)"
          test -n "${first_asset}"
          test -s "/tmp/c5vrx-pages-test/${first_asset}"

      - name: Run host range / demod tests
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_demod_quality.c -o /tmp/test_demod_quality
          /tmp/test_demod_quality
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_range_control.c -o /tmp/test_range_control
          /tmp/test_range_control
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_fusion_receiver.c -o /tmp/test_fusion_receiver
          /tmp/test_fusion_receiver
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_menu_raster.c main/menu_raster.c -lm -o /tmp/test_menu_raster
          /tmp/test_menu_raster
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_arc.c main/arc_phy.c -o /tmp/test_arc
          /tmp/test_arc
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_direct_gain_v2.c main/direct_gain_v2.c main/arc_phy.c -o /tmp/test_direct_gain_v2
          /tmp/test_direct_gain_v2
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_direct_gain_v3.c main/direct_gain_v3.c main/arc_phy.c -o /tmp/test_direct_gain_v3
          /tmp/test_direct_gain_v3
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -Imain tools/test_analog_video_detect.c main/analog_video_detect.c -lm -o /tmp/test_analog_video_detect
          /tmp/test_analog_video_detect
          python3 -m pip install --quiet numpy
          python3 tools/analyze_agc_words.py --self-test
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_rx_auto_lab.c main/rx_auto_lab.c -o /tmp/test_rx_auto_lab
          /tmp/test_rx_auto_lab
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_arc_v3.c main/arc_v3_controller.c -o /tmp/test_arc_v3
          /tmp/test_arc_v3
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_arc_v5_autotune.c main/arc_v5_autotune.c main/arc_v3_controller.c -o /tmp/test_arc_v5_autotune
          /tmp/test_arc_v5_autotune
          python3 tools/train_trajectory_v2.py --write --self-test
          git diff --exit-code -- main/fm_traj.bsasm main/trajectory_v2_lut.h
          python3 tools/range_demod_bench.py --self-test
          gcc -std=c11 -Wall -Wextra -Werror -Imain tools/test_phase8_envelope.c main/direct_gain_v3.c main/arc_phy.c -o /tmp/test_phase8_envelope
          /tmp/test_phase8_envelope
          python3 tools/p8env_sweep.py --self-test
          python3 tools/test_fm_hc.py
          python3 tools/check_golden_two_slot.py

  build:
    name: Build Production Firmware (ESP32-C5)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    # A release or Pages deployment must never be produced from a commit that
    # failed the architectural/DSP contract checks.
    needs: [version, validate]
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp release version into ESP-IDF firmware
        if: needs.version.outputs.version_number != ''
        shell: bash
        run: |
          printf '%s\n' "${{ needs.version.outputs.version_number }}" > version.txt
          echo "Building firmware version ${{ needs.version.outputs.version }}"

      - name: Build C5VRX-3 Firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py build

      - name: Prepare Release Artifacts
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          mkdir -p release
          cp build/bootloader/bootloader.bin release/
          cp build/partition_table/partition-table.bin release/
          cp build/c5vrx3.bin release/
          cp build/flasher_args.json release/
          esptool.py --chip esp32c5 merge_bin -o release/c5vrx3_merged.bin \
            --flash_mode dio --flash_size 8MB --flash_freq 80m \
            0x2000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/c5vrx3.bin

          if [[ -n "${{ needs.version.outputs.version }}" ]]; then
            printf '%s\n' "${{ needs.version.outputs.version }}" > release/VERSION
          fi

          python3 tools/firmware_input_hash.py 3 > release/FIRMWARE_INPUT_SHA
          cd release
          sha256sum * > SHA256SUMS

      - name: Upload Production Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c5vrx3-production-firmware
          path: release/
          if-no-files-found: error

  publish-pr-build:
    name: Publish Experimental PR Build
    needs: [build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: c5vrx3-production-firmware
          path: release/

      - name: Publish mutable PR prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pr-${PR_NUMBER}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            previous="$(mktemp -d)"
            if gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern FIRMWARE_INPUT_SHA --dir "$previous" &&
               cmp -s "$previous/FIRMWARE_INPUT_SHA" release/FIRMWARE_INPUT_SHA; then
              echo "Firmware inputs unchanged; keeping existing PR build."
              rm -rf "$previous"
              exit 0
            fi
            rm -rf "$previous"
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          fi

          gh release create "${tag}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${PR_HEAD_SHA}" \
            --title "C5VRX PR #${PR_NUMBER} — Experimental Build" \
            --notes "WARNING: unmerged test firmware for PR #${PR_NUMBER} (${PR_TITLE}). This mutable prerelease is intended only for explicit hardware testing; use a semantic-version release for normal flashing." \
            --prerelease

  cleanup-pr-build:
    name: Remove Closed PR Build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete PR prerelease and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          tag="pr-${PR_NUMBER}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          else
            echo "No PR prerelease ${tag} to remove."
          fi

  release-main:
    name: Publish Versioned Main Release
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: c5vrx3-production-firmware
          path: release/

      - name: Publish immutable semantic-version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
          VERSION_REASON: ${{ needs.version.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VERSION}" ]]; then
            echo "No release version resolved."
            exit 1
          fi

          echo "Publishing ${VERSION}: ${VERSION_REASON}"

          # A re-run after the release was already created should succeed
          # without minting another version.
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; leaving it unchanged."
          else
            args=(
              release create "${VERSION}" release/*
              --repo "${GITHUB_REPOSITORY}"
              --target "${GITHUB_SHA}"
              --title "C5VRX-3 ${VERSION}"
              --generate-notes
              --latest
            )

            if [[ -n "${PREVIOUS_TAG}" ]]; then
              args+=(--notes-start-tag "${PREVIOUS_TAG}")
            fi

            gh "${args[@]}"
          fi

          # One-time cleanup of the old mutable release/tag model. This does
          # not touch the main branch; it only removes refs/tags/main.
          if gh release view main --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete main --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          fi

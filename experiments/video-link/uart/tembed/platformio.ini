; LilyGo T-Embed CC1101 (ESP32-S3) -- display end of the C5VRX UART video link.
;
; Receives the 224x168 luma frames that a C5VRX built with the xiao_c5_link
; environment grabs from the FPV signal, and shows them on the 320x170 ST7789.
; Uses the official espressif32 platform with Arduino-ESP32 2.0.17 (already
; installed on the development host) and ESP-IDF's own esp_lcd ST7789 driver,
; so no display library is needed.

[platformio]
default_envs = tembed
src_dir = src
; Separate package store. This official platform and the pioarduino platform
; of the C5 project use the same package names (tool-esptoolpy,
; toolchain-riscv32-esp) in different versions; sharing ~/.platformio/packages
; made each build replace the other's packages. The large, identical packages
; (Arduino framework, S3 toolchain) are directory junctions into the shared
; store, see README.md.
packages_dir = ${sysenv.USERPROFILE}/.platformio/packages-s3

[env:tembed]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3R8: 16 MB QIO flash, 8 MB OPI PSRAM (settings from the working
; 1101view project for this board).
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; ../protocol holds link_proto.h, the link protocol shared with the C5 firmware.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -O2
    -I$PROJECT_DIR/../protocol
monitor_speed = 115200
upload_speed = 921600

; C5VRX UART video link (experiments/video-link/uart) -- PlatformIO project.
;
; The same ESP-IDF project as CMakeLists.txt in this directory: the receiver
; (the repository's main/, PlatformIO's src_dir) plus
; components/video_link_uart. Platform and packages are the root
; platformio.ini's (see there why they are pinned); keep both in step.
;
; PlatformIO writes the generated configuration to sdkconfig.<env> here
; (git-ignored); delete it to re-apply the sdkconfig defaults after editing
; them. Run pio from PowerShell or cmd on Windows (not Git Bash). Flash with
; python ../../../tools/flash_pio.py xiao_c5_link (or xiao_c5_link_debug).

[platformio]
default_envs = xiao_c5_link
src_dir = ../../../main

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#59fa8606f96e68f1bc021ba5f4ece28be0d1c42f
platform_packages =
    pioarduino/framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v6.0.1/esp-idf-v6.0.1.tar.xz
    pioarduino/tool-esptoolpy @ https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.3.1.zip
framework = espidf
board = seeed_xiao_esp32c5
board_build.partitions = ../../../partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
extra_scripts = pre:../../../tools/pio_idf_toolchain.py
monitor_speed = 115200
upload_speed = 460800

; Final build: nothing on the console while streaming.
[env:xiao_c5_link]

; Desk build: [STREAM] statistics, 'v' / 'g' dumps for tools/link_dump.py and
; tools/link_frame.py (sdkconfig.debug.defaults).
[env:xiao_c5_link_debug]
board_build.cmake_extra_args = -DVIDEO_LINK_DEBUG=1
